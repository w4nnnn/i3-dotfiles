#################################
#       General Settings        #
#################################
backend = "glx";
vsync = true;
use-damage = true;
log-level = "warn";

#################################
#           Corners             #
#################################
corner-radius = 12;

#################################
#           Shadows             #
#################################
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.50;
shadow-offset-x = -10;
shadow-offset-y = -10;

#################################
#     Background Blurring       #
#################################
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;

#################################
#          Animations           #
#################################
animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    scale = 0.90;
    duration = 0.22;
  },
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    scale = 0.90;
    duration = 0.16;
  }
);

#################################
#         Window Rules          #
#################################
rules = (
  # Inactive and Active Opacity
  {
    match = "!focused";
    opacity = 0.95;
  },
  {
    match = "focused";
    opacity = 1.0;
  },

  # Apps that should always be fully opaque and never blurred
  {
    match = "class_g = 'Brave-browser' || class_g = 'brave-browser' || class_g = 'firefox' || class_g = 'Chromium' || class_g = 'google-chrome' || class_g = 'mpv' || class_g = 'feh' || class_g = 'flameshot'";
    opacity = 1.0;
    blur-background = false;
  },

  # Disable rounded corners on fullscreen
  {
    match = "fullscreen";
    corner-radius = 0;
  },

  # Windows shaped via XShape or ARGB (prevent double rounding conflicts)
  {
    match = "class_g = 'Rofi' || class_g = 'rofi' || class_g = 'Win11-start' || class_g = 'Control-center' || name = 'Windows11StartMenu' || name = 'CatppuccinControlCenter'";
    corner-radius = 0;
  },

  # Exclude docks, polybar, xcorners, desktop, flameshot, and slop from blur, shadows, animations
  {
    match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Polybar' || class_g = 'xcorners' || class_g = 'slop' || class_g = 'flameshot'";
    shadow = false;
    corner-radius = 0;
    blur-background = false;
    animations = ();
  },

  # Tooltips, popup menus, and dropdowns (must be fully opaque and excluded from blur, shadows, and animations)
  {
    match = "window_type = 'tooltip' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'combo'";
    opacity = 1.0;
    shadow = false;
    blur-background = false;
    corner-radius = 0;
    animations = ();
  }
);
