;==========================================================
;
;   POLYBAR CONFIGURATION - HyDE + LUCIDE ICONS (CATPPUCCIN MOCHA)
;
;==========================================================

[colors]
base = #1e1e2e
mantle = #181825
crust = #11111b
surface0 = #313244
surface1 = #45475a
surface2 = #585b70
text = #cdd6f4
subtext = #a6adc8
mauve = #cba6f7
pink = #f5c2e7
red = #f38ba8
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
sapphire = #74c7ec
blue = #89b4fa
lavender = #b4befe
transparent = #00000000

[bar/main]
width = 100%
height = 36px
radius = 0

offset-x = 0
offset-y = 0

fixed-center = true

background = ${colors.base}
foreground = ${colors.text}

border-size = 0

padding-left = 2
padding-right = 2

module-margin = 1

separator = "·"
separator-foreground = ${colors.surface1}

font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"
font-2 = "JetBrainsMono Nerd Font:size=13;3"
font-3 = "lucide:size=11;4"

modules-left = arch i3 xwindow
modules-center = date
modules-right = pulseaudio memory cpu eth tray controlcenter

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3

; ---------------------------------------------------------
; ARCH LOGO (LAUNCHER BUTTON)
; ---------------------------------------------------------
[module/arch]
type = custom/text
format = "%{A1:rofi -show drun:}<label>%{A}"
label = " 󰣇 "
label-foreground = ${colors.blue}
label-font = 3

; ---------------------------------------------------------
; WORKSPACES (i3)
; ---------------------------------------------------------
[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.red}
label-mode-foreground = ${colors.crust}

label-focused = %name%
label-focused-foreground = ${colors.crust}
label-focused-background = ${colors.mauve}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext}
label-unfocused-padding = 2

label-visible = %name%
label-visible-underline = ${colors.surface1}
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.crust}
label-urgent-background = ${colors.red}
label-urgent-padding = 2

; ---------------------------------------------------------
; ACTIVE WINDOW TITLE
; ---------------------------------------------------------
[module/xwindow]
type = internal/xwindow
label = " %title:0:30:...% "
label-foreground = ${colors.lavender}
label-empty = " Desktop "
label-empty-foreground = ${colors.surface2}

; ---------------------------------------------------------
; DATE & TIME (LUCIDE CALENDAR & CLOCK)
; ---------------------------------------------------------
[module/date]
type = internal/date
interval = 1

date = %a, %d %b
time = %H:%M

format = "%{A1:calendar-popup:}<label>%{A}"
format-prefix = " "
format-prefix-foreground = ${colors.yellow}

label = "%date%  ·   %time%"
label-foreground = ${colors.text}

; ---------------------------------------------------------
; PULSEAUDIO (LUCIDE VOLUME)
; ---------------------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio

format-volume = "%{A1:pactl set-sink-mute @DEFAULT_SINK@ toggle:}%{A3:pavucontrol 2>/dev/null || pactl set-sink-mute @DEFAULT_SINK@ toggle:}<ramp-volume> <label-volume>%{A}%{A}"

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.blue}

label-volume = %percentage%%
label-volume-foreground = ${colors.text}

format-muted = "%{A1:pactl set-sink-mute @DEFAULT_SINK@ toggle:}<label-muted>%{A}"
label-muted = " muted"
label-muted-foreground = ${colors.red}

scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

; ---------------------------------------------------------
; RAM / MEMORY (LUCIDE HARD-DRIVE / STORAGE)
; ---------------------------------------------------------
[module/memory]
type = internal/memory
interval = 3

format = "%{A1:toggle-htop:}<label>%{A}"
format-prefix = " "
format-prefix-foreground = ${colors.pink}

label = %gb_used%
label-foreground = ${colors.text}

; ---------------------------------------------------------
; CPU USAGE (LUCIDE CPU)
; ---------------------------------------------------------
[module/cpu]
type = internal/cpu
interval = 3

format = "%{A1:toggle-htop:}<label>%{A}"
format-prefix = " "
format-prefix-foreground = ${colors.teal}

label = %percentage%%
label-foreground = ${colors.text}

; ---------------------------------------------------------
; ETHERNET / NETWORK (LUCIDE NETWORK)
; ---------------------------------------------------------
[network-base]
type = internal/network
interval = 5

format-connected = "%{A1:networkmanager_dmenu:}%{A3:nm-connection-editor:}%{A2:network-info:}<label-connected>%{A}%{A}%{A}"
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.green}

format-disconnected = "%{A1:networkmanager_dmenu:}%{A3:nm-connection-editor:}<label-disconnected>%{A}%{A}"
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.red}
label-disconnected = "Offline"
label-disconnected-foreground = ${colors.subtext}

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %netspeed%
label-connected-foreground = ${colors.text}

; ---------------------------------------------------------
; CONTROL CENTER / QUICK SETTINGS (LUCIDE SLIDERS)
; ---------------------------------------------------------
[module/controlcenter]
type = custom/text
format = "%{A1:control-center:}<label>%{A}"
label = ""
label-foreground = ${colors.mauve}

; ---------------------------------------------------------
; SYSTEM TRAY (BACKGROUND APPS: 9router, Discord, etc.)
; ---------------------------------------------------------
[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 16px

[settings]
screenchange-reload = true
pseudo-transparency = true
