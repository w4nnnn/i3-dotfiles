;==========================================================
;
;   POLYBAR CONFIGURATION - HyDE + LUCIDE ICONS (CATPPUCCIN MOCHA)
;
;==========================================================

include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 36px
radius = 0

offset-x = 0
offset-y = 0

fixed-center = true

background = ${colors.base}
foreground = ${colors.text}

border-size = 0

padding-left = 2
padding-right = 2

module-margin = 1

separator = "·"
separator-foreground = ${colors.surface1}

font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"
font-2 = "JetBrainsMono Nerd Font:size=13;3"
font-3 = "lucide:size=11;3"
font-4 = "lucide:size=13;3"

modules-left = arch i3 xwindow
modules-center = date
modules-right = network battery tray controlcenter

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3

; ---------------------------------------------------------
; ARCH LOGO (LAUNCHER BUTTON)
; ---------------------------------------------------------
[module/arch]
type = custom/text
format = "%{A1:win11-start:}<label>%{A}"
label = "󰣇"
label-foreground = ${colors.blue}
label-font = 3

; ---------------------------------------------------------
; WORKSPACES (i3)
; ---------------------------------------------------------
[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.red}
label-mode-foreground = ${colors.crust}

label-focused = %name%
label-focused-foreground = ${colors.crust}
label-focused-background = ${colors.mauve}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext}
label-unfocused-padding = 2

label-visible = %name%
label-visible-underline = ${colors.surface1}
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.crust}
label-urgent-background = ${colors.red}
label-urgent-padding = 2

; ---------------------------------------------------------
; ACTIVE WINDOW TITLE
; ---------------------------------------------------------
[module/xwindow]
type = internal/xwindow
label = " %title:0:30:...% "
label-foreground = ${colors.lavender}
label-empty = " Desktop "
label-empty-foreground = ${colors.surface2}

; ---------------------------------------------------------
; DATE & TIME (LUCIDE CALENDAR & CLOCK)
; ---------------------------------------------------------
[module/date]
type = internal/date
interval = 1

date = %a, %d %b
time = %H:%M

format = "%{A1:calendar-popup:}<label>%{A}"
format-prefix = " "
format-prefix-foreground = ${colors.yellow}

label = "%date%  ·   %time%"
label-foreground = ${colors.text}

; ---------------------------------------------------------
; PULSEAUDIO (LUCIDE VOLUME)
; ---------------------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>

label-volume = %percentage%%
label-volume-foreground = ${colors.text}

label-muted = " muted"
label-muted-foreground = ${colors.red}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.blue}

click-right = ~/.local/bin/audio-selector
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-middle = ~/.local/bin/control-center

scroll-up = ~/.local/bin/volume-control up
scroll-down = ~/.local/bin/volume-control down

; ---------------------------------------------------------
; RAM / MEMORY (LUCIDE HARD-DRIVE / STORAGE)
; ---------------------------------------------------------
[module/memory]
type = internal/memory
interval = 3

format = "%{A1:toggle-htop:}<label>%{A}"
format-prefix = " "
format-prefix-foreground = ${colors.pink}

label = %gb_used%
label-foreground = ${colors.text}

; ---------------------------------------------------------
; CPU USAGE (LUCIDE CPU)
; ---------------------------------------------------------
[module/cpu]
type = internal/cpu
interval = 3

format = "%{A1:toggle-htop:}<label>%{A}"
format-prefix = " "
format-prefix-foreground = ${colors.teal}

label = %percentage%%
label-foreground = ${colors.text}

; ---------------------------------------------------------
; NETWORK (DYNAMIC WI-FI / ETHERNET / OFFLINE)
; ---------------------------------------------------------
[module/network]
type = custom/script
exec = ~/.local/bin/network-status-bar
tail = true
click-left = ~/.local/bin/network-menu
click-middle = ~/.local/bin/network-info
click-right = kitty --class floating_terminal -e nmtui

; ---------------------------------------------------------
; BATTERY (LAPTOP POWER STATUS - AUTO-DETECTED)
; ---------------------------------------------------------
[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BATTERY:BAT1}
adapter = ${env:POLYBAR_ADAPTER:ACAD}
full-at = 98
low-at = 20
poll-interval = 5

format-charging = "%{A1:~/.local/bin/battery-info:}%{A3:~/.local/bin/battery-info:}<label-charging>%{A}%{A}"
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.green}

format-discharging = "%{A1:~/.local/bin/battery-info:}%{A3:~/.local/bin/battery-info:}<ramp-capacity> <label-discharging>%{A}%{A}"
format-full = "%{A1:~/.local/bin/battery-info:}%{A3:~/.local/bin/battery-info:}<ramp-capacity> <label-full>%{A}%{A}"
format-low = "%{A1:~/.local/bin/battery-info:}%{A3:~/.local/bin/battery-info:}<ramp-capacity> <label-low>%{A}%{A}"

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
label-low-foreground = ${colors.red}

ramp-capacity-0 = ""
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1 = ""
ramp-capacity-1-foreground = ${colors.peach}
ramp-capacity-2 = ""
ramp-capacity-2-foreground = ${colors.yellow}
ramp-capacity-3 = ""
ramp-capacity-3-foreground = ${colors.green}

; ---------------------------------------------------------
; CONTROL CENTER / QUICK SETTINGS (LUCIDE SLIDERS)
; ---------------------------------------------------------
[module/controlcenter]
type = custom/text
format = "%{A1:control-center:}<label>%{A}"
label = ""
label-foreground = ${colors.mauve}
label-font = 5

; ---------------------------------------------------------
; SYSTEM TRAY (BACKGROUND APPS: 9router, Discord, etc.)
; ---------------------------------------------------------
[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 16px

[settings]
screenchange-reload = true
pseudo-transparency = true
